name: Operator CI

on:
  push:
    branches: [main]
    paths:
      - 'operator/**'
      - 'helm/omniscience-operator/**'
      - '.github/workflows/operator.yml'
  pull_request:
    branches: [main]
    paths:
      - 'operator/**'
      - 'helm/omniscience-operator/**'
      - '.github/workflows/operator.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: operator

jobs:
  go:
    name: Go (build / vet / test / lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: operator/go.sum
      - run: go mod download
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61.0
          working-directory: operator
          args: --timeout=5m

  helm:
    name: Helm lint + template
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.15.4
      - name: helm lint
        run: helm lint helm/omniscience-operator
      - name: helm template (with required values)
        run: |
          helm template omniscience-operator helm/omniscience-operator \
            --set workspaceId=11111111-2222-3333-4444-555555555555 \
            --set clusterName=ci \
            --set nats.url=nats://nats:4222
