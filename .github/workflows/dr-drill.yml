name: DR Drill

# Nightly DR drill + manual trigger.
# Owns its own service containers — does NOT touch ci.yml or calibration-gate.yml jobs.
# Fails if:
#   - rebuild_all_projections.py exits non-zero (verification mismatch: exit 3)
#   - RTO budget exceeded (exit 2)
#   - any step command fails

on:
  schedule:
    # 02:00 UTC every day — after nightly backups complete, before business hours.
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      rto_seconds:
        description: "RTO budget in seconds (default: 120 for fixture dataset)"
        required: false
        default: "120"

permissions:
  contents: read

jobs:
  dr-drill:
    name: DR rebuild drill
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: omniscience_dr_drill
          POSTGRES_USER: omniscience
          POSTGRES_PASSWORD: dr_drill_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      neo4j:
        # Version matches docker-compose.yml neo4j service image.
        image: neo4j:5.19-community
        env:
          NEO4J_AUTH: neo4j/dr_drill_password
          NEO4J_server_memory_heap_initial__size: 512m
          NEO4J_server_memory_heap_max__size: 1G
          NEO4J_server_memory_pagecache_size: 256m
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "wget -q -O - http://localhost:7474 > /dev/null"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 45s

      qdrant:
        # Version matches docker-compose.yml qdrant service image.
        image: qdrant/qdrant:v1.12.4
        ports:
          - 6333:6333
          - 6334:6334
        options: >-
          --health-cmd "bash -c '</dev/tcp/localhost/6333'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 20s

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.6.2"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --extra local

      - name: Run database migrations
        working-directory: packages/core
        env:
          DATABASE_URL: postgresql+asyncpg://omniscience:dr_drill_test@localhost:5432/omniscience_dr_drill
        run: uv run alembic upgrade head

      - name: Seed fixture dataset
        # Seeds a small deterministic dataset directly into Postgres so the
        # rebuild has something to verify against.  The seed script inserts
        # a fixed workspace, 1 source, 3 documents, 9 chunks.
        env:
          DATABASE_URL: postgresql+asyncpg://omniscience:dr_drill_test@localhost:5432/omniscience_dr_drill
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USERNAME: neo4j
          NEO4J_PASSWORD: dr_drill_password
          QDRANT_HOST: localhost
          QDRANT_HTTP_PORT: "6333"
          QDRANT_GRPC_PORT: "6334"
          OMNISCIENCE_DR_DRILL: "1"
        run: uv run python scripts/seed_dr_drill.py

      - name: Determine RTO budget
        id: rto
        run: |
          # Use the workflow_dispatch input when provided; otherwise default to 120 s.
          RTO="${{ github.event.inputs.rto_seconds }}"
          if [ -z "$RTO" ]; then
            RTO=120
          fi
          echo "rto_seconds=$RTO" >> "$GITHUB_OUTPUT"

      - name: Run DR rebuild with RTO enforcement
        env:
          DATABASE_URL: postgresql+asyncpg://omniscience:dr_drill_test@localhost:5432/omniscience_dr_drill
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USERNAME: neo4j
          NEO4J_PASSWORD: dr_drill_password
          QDRANT_HOST: localhost
          QDRANT_HTTP_PORT: "6333"
          QDRANT_GRPC_PORT: "6334"
          EMBEDDING_PROVIDER: local
        # Exit codes:
        #   0 — rebuild + verification passed, RTO met
        #   2 — RTO exceeded
        #   3 — verification mismatch
        run: |
          uv run python scripts/rebuild_all_projections.py \
            --yes \
            --recompute-embeddings \
            --rto-seconds "${{ steps.rto.outputs.rto_seconds }}"

      - name: Verify-only pass (idempotency check)
        # Re-run the verification step without another wipe to confirm
        # the projections are stable across two consecutive checks.
        env:
          DATABASE_URL: postgresql+asyncpg://omniscience:dr_drill_test@localhost:5432/omniscience_dr_drill
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USERNAME: neo4j
          NEO4J_PASSWORD: dr_drill_password
          QDRANT_HOST: localhost
          QDRANT_HTTP_PORT: "6333"
          QDRANT_GRPC_PORT: "6334"
          EMBEDDING_PROVIDER: local
        run: |
          uv run python scripts/rebuild_all_projections.py \
            --verify-only \
            --rto-seconds "${{ steps.rto.outputs.rto_seconds }}"

      - name: Run DR unit + integration tests
        env:
          DATABASE_URL: postgresql+asyncpg://omniscience:dr_drill_test@localhost:5432/omniscience_dr_drill
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USERNAME: neo4j
          NEO4J_PASSWORD: dr_drill_password
          QDRANT_HOST: localhost
          QDRANT_HTTP_PORT: "6333"
          QDRANT_GRPC_PORT: "6334"
          EMBEDDING_PROVIDER: local
          OMNISCIENCE_DR_DRILL: "1"
        run: |
          uv run pytest tests/test_dr_rebuild.py -v --no-header
