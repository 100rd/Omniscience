[project]
name = "omniscience-server"
version = "0.2.0"
description = "Omniscience API server (FastAPI + FastMCP)"
requires-python = ">=3.12"
dependencies = [
    "omniscience-core",
    "omniscience-connectors",
    "omniscience-embeddings",
    "omniscience-index",
    "omniscience-retrieval",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "mcp>=1.0.0",
    # Retention worker (issue #135) — archive tier writes Parquet to S3
    # per ADR-0009 §1 archive / §7 storage layout.  pyarrow handles
    # columnar serialisation; boto3 handles the S3 PUT path.
    "pyarrow>=17.0.0",
    "boto3>=1.42.91",
]

[tool.uv.sources]
omniscience-core = { workspace = true }
omniscience-connectors = { workspace = true }
omniscience-embeddings = { workspace = true }
omniscience-index = { workspace = true }
omniscience-retrieval = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omniscience_server"]
