# golangci-lint configuration for omniscience-operator.
#
# Aligns roughly with kubebuilder defaults, with a few additions that match
# the standards in CLAUDE.md (no magic constants, single responsibility).

version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - gocritic
    - gosec
  settings:
    revive:
      rules:
        - name: exported
          arguments:
            - "checkPrivateReceivers"
            - "disableStutteringCheck"
    gosec:
      excludes:
        # G104: errors not checked — handled per-call by errcheck above.
        - G104

issues:
  max-same-issues: 0
  max-issues-per-linter: 0
