# Global settings
replicaCount: 1

image:
  repository: omniscience
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: omniscience.local
      paths:
        - path: /
          pathType: ImplementationSpecific

# Built-in dependencies (sub-charts)
postgresql:
  enabled: true
  auth:
    database: omniscience
    username: omniscience
    password: "change-me"

neo4j:
  enabled: true
  neo4j:
    password: "change-me"

qdrant:
  enabled: true

nats:
  enabled: true
  nats:
    jetstream:
      enabled: true

# Application Config
config:
  logLevel: "INFO"
  environment: "production"
  storage:
    graph: "neo4j"
    vector: "qdrant"
  retention:
    enabled: true
    hotDays: 90
    warmDays: 365
  discovery:
    intervalSeconds: 3600
