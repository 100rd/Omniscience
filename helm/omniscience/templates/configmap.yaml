apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "omniscience.fullname" . }}
  labels:
    {{- include "omniscience.labels" . | nindent 4 }}
data:
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  EMBEDDINGS_PROVIDER: {{ .Values.config.embeddingsProvider | quote }}
  EMBEDDING_MODEL: {{ .Values.config.embeddingModel | quote }}
  MCP_TRANSPORT: {{ .Values.config.mcpTransport | quote }}
  FRESHNESS_SLO_SECONDS: {{ .Values.config.freshnessSloSeconds | toString | quote }}
  {{- if .Values.config.ollamaUrl }}
  OLLAMA_URL: {{ .Values.config.ollamaUrl | quote }}
  {{- end }}
  {{- if .Values.config.openaiBaseUrl }}
  OPENAI_BASE_URL: {{ .Values.config.openaiBaseUrl | quote }}
  {{- end }}
  {{- if .Values.config.corsOrigins }}
  CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}
  {{- end }}
  DATABASE_URL: {{ include "omniscience.databaseUrl" . | quote }}
  NATS_URL: {{ include "omniscience.natsUrl" . | quote }}
  # Retention worker (ADR-0009, issue #135).  Global-only boundaries
  # per ADR-0009 §10; per-tenant overrides are out of scope for v1.
  RETENTION_ENABLED: {{ .Values.retention.enabled | toString | quote }}
  RETENTION_HOT_DAYS: {{ .Values.retention.hotDays | toString | quote }}
  RETENTION_WARM_DAYS: {{ .Values.retention.warmDays | toString | quote }}
  RETENTION_ARCHIVE_YEARS: {{ .Values.retention.archiveYears | toString | quote }}
  RETENTION_TICK_SECONDS: {{ .Values.retention.tickSeconds | toString | quote }}
  RETENTION_DRY_RUN: {{ .Values.retention.dryRun | toString | quote }}
  RETENTION_BATCH_SIZE: {{ .Values.retention.batchSize | toString | quote }}
  RETENTION_SAMPLE_SIZE: {{ .Values.retention.sampleSize | toString | quote }}
  {{- if .Values.retention.archiveBucket }}
  RETENTION_ARCHIVE_BUCKET: {{ .Values.retention.archiveBucket | quote }}
  {{- end }}
  {{- if .Values.retention.archiveKmsKeyArn }}
  RETENTION_ARCHIVE_KMS_KEY_ARN: {{ .Values.retention.archiveKmsKeyArn | quote }}
  {{- end }}
  {{- if .Values.retention.archiveS3EndpointUrl }}
  RETENTION_ARCHIVE_S3_ENDPOINT_URL: {{ .Values.retention.archiveS3EndpointUrl | quote }}
  {{- end }}
  RETENTION_ARCHIVE_S3_REGION: {{ .Values.retention.archiveS3Region | quote }}
  # Reconciliation worker (REQ-OPS-6) — see omniscience.posture.
  RECONCILE_ENABLED: {{ .Values.config.reconcileEnabled | toString | quote }}
  # Shared read admission (issue #350, AC-SCALE-1..5). Only rendered when
  # production.admission.enabled=true, which (via omniscience.admissionGuards)
  # guarantees every field below is populated. Independent of
  # production.enabled — the default/eval and plain production-HA installs
  # render none of these, so Settings keeps its "disabled" default
  # (packages/core/.../config.py).
  {{- if .Values.production.admission.enabled }}
  ADMISSION_BACKEND: {{ .Values.production.admission.backend | quote }}
  ADMISSION_BACKEND_IDENTITY: {{ .Values.production.admission.backendIdentity | quote }}
  ADMISSION_LANE_INCIDENT_BUDGET: {{ .Values.production.admission.laneIncidentBudget | toString | quote }}
  ADMISSION_LANE_BACKGROUND_BUDGET: {{ .Values.production.admission.laneBackgroundBudget | toString | quote }}
  ADMISSION_QUEUE_DEPTH_MAX: {{ .Values.production.admission.queueDepthMax | toString | quote }}
  ADMISSION_LATENCY_THRESHOLD_MS: {{ .Values.production.admission.latencyThresholdMs | toString | quote }}
  ADMISSION_ERROR_RATE_THRESHOLD: {{ .Values.production.admission.errorRateThreshold | toString | quote }}
  ADMISSION_FAILURE_RESERVE_FRACTION: {{ .Values.production.admission.failureReserveFraction | toString | quote }}
  {{- end }}
