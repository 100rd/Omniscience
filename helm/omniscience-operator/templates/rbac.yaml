{{- if .Values.rbac.create -}}
# v0.2 RBAC: cluster-scoped read-only on workload primitives. Verbs are
# strictly get/list/watch — the operator never mutates K8s state. Per
# ADR-0007 §ACL the operator is observation-only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "omniscience-operator.fullname" . }}
  labels:
    {{- include "omniscience-operator.labels" . | nindent 4 }}
rules:
  # Pods (issue #101 — operator scaffold).
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # Workload watchers (issue #157): Deployment, ReplicaSet, StatefulSet,
  # DaemonSet — the apps/v1 quartet that owns / is owned by Pods.
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  # Workload watcher (issue #157): Job. CronJob is deferred to a follow-up
  # sub-issue — do NOT add "cronjobs" here until that issue lands.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
  # ── #158 networking + config watchers ──────────────────────────────────
  # Read-only verbs only. The Secret get/list permission is unavoidable for
  # the watcher to function; the controller's secret_controller.go +
  # internal/entity/secret.go drop all values at the mapper boundary, and
  # the structural test in entity/secret_test.go asserts no value bytes
  # ever reach the published Event. See docs/connectors/k8s-operator-secrets.md.
  - apiGroups: [""]
    resources: ["services", "endpoints", "configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch"]
  # ── end #158 ──────────────────────────────────────────────────────────
  # Leader election lease — namespaced; gated to the operator's own namespace
  # below.
  {{- if .Values.leaderElection.enabled }}
  # (see RoleBinding below for the namespaced lease permission)
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "omniscience-operator.fullname" . }}
  labels:
    {{- include "omniscience-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "omniscience-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "omniscience-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.leaderElection.enabled }}
---
# Lease object lives in the operator's own namespace; this is the only
# write capability the operator has, and it is namespaced rather than cluster-wide.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "omniscience-operator.fullname" . }}-leader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "omniscience-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "omniscience-operator.fullname" . }}-leader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "omniscience-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "omniscience-operator.fullname" . }}-leader
subjects:
  - kind: ServiceAccount
    name: {{ include "omniscience-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
