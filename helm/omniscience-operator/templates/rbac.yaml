{{- if .Values.rbac.create -}}
# v0.2 RBAC: cluster-scoped read-only on workload primitives. Verbs are
# strictly get/list/watch — the operator never mutates K8s state. Per
# ADR-0007 §ACL the operator is observation-only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "omniscience-operator.fullname" . }}
  labels:
    {{- include "omniscience-operator.labels" . | nindent 4 }}
rules:
  # Pods (issue #101 — operator scaffold).
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # Workload watchers (issue #157): Deployment, ReplicaSet, StatefulSet,
  # DaemonSet — the apps/v1 quartet that owns / is owned by Pods.
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  # Workload watcher (issue #157): Job + CronJob (issue #210).
  # CronJob is the parent template that spawns Jobs on a schedule; the Job
  # watcher already covers the spawned Jobs themselves.
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  # ── #158 networking + config watchers ──────────────────────────────────
  # Read-only verbs only. The Secret get/list permission is unavoidable for
  # the watcher to function; the controller's secret_controller.go +
  # internal/entity/secret.go drop all values at the mapper boundary, and
  # the structural test in entity/secret_test.go asserts no value bytes
  # ever reach the published Event. See docs/connectors/k8s-operator-secrets.md.
  - apiGroups: [""]
    resources: ["services", "endpoints", "configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch"]
  # ── end #158 ──────────────────────────────────────────────────────────
  # ── #202 LimitRange watcher (epic #199 v0.4 parity) ───────────────────
  # Read-only verbs only. LimitRange is namespaced under core/v1; the
  # ClusterRole binding above grants the watch cluster-wide so the
  # informer sees LimitRanges in every namespace.
  - apiGroups: [""]
    resources: ["limitranges"]
    verbs: ["get", "list", "watch"]
  # ── end #202 ──────────────────────────────────────────────────────────
  # ── #204 ResourceQuota watcher (epic #199 v0.4 parity) ────────────────
  # Read-only verbs only. ResourceQuota is namespaced under core/v1.
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["get", "list", "watch"]
  # ── end #204 ──────────────────────────────────────────────────────────
  # ── #206 ServiceAccount watcher (epic #199 v0.4 parity) ───────────────
  # Read-only verbs only. ServiceAccount is namespaced under core/v1.
  # The mapper emits ONLY Secret reference NAMES — no values; the operator
  # never reads Secret data via the SA references.
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "watch"]
  # ── end #206 ──────────────────────────────────────────────────────────
  # ── #208 PersistentVolumeClaim watcher (epic #199 v0.4 parity) ────────
  # Read-only verbs only. PVC is namespaced under core/v1; the bound PV
  # is already covered cluster-wide by #159.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  # ── end #208 ──────────────────────────────────────────────────────────
  # ── #212 RBAC watchers (Role + RoleBinding + ClusterRole + ClusterRoleBinding) ──
  # Read-only verbs only. The operator emits the RBAC graph itself — it
  # never grants or revokes permissions. Role / RoleBinding are namespaced;
  # ClusterRole / ClusterRoleBinding are cluster-scoped. All under
  # rbac.authorization.k8s.io.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    verbs: ["get", "list", "watch"]
  # ── end #212 ──────────────────────────────────────────────────────────
  # ── #214 HorizontalPodAutoscaler watcher (last v0.4 release-blocker) ──
  # Read-only verbs only. HPA is namespaced under autoscaling/v2.
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  # ── end #214 ──────────────────────────────────────────────────────────
  # --- BEGIN issue #159: cluster-scoped watcher RBAC ---
  # Node, Namespace, PersistentVolume — all cluster-scoped under the core
  # API group. ClusterRole + ClusterRoleBinding above already grants the
  # binding cluster-wide; no per-namespace RoleBinding is needed.
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "persistentvolumes"]
    verbs: ["get", "list", "watch"]
  # StorageClass lives under storage.k8s.io/v1 — cluster-scoped.
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  # --- END issue #159 ---
  # ── #160 ArgoCD CRDs (discovery-skip if absent) ────────────────────────
  # The controllers register only when the CRDs are present (see
  # argocd_setup.go::DiscoverArgoCD). RBAC is granted unconditionally —
  # rules on non-existent resources are inert. Application is namespaced;
  # ApplicationSet is also namespaced (typically argocd namespace).
  - apiGroups: ["argoproj.io"]
    resources: ["applications", "applicationsets"]
    verbs: ["get", "list", "watch"]
  # ── end #160 ──────────────────────────────────────────────────────────
  # ── #161 Argo Rollouts CRD coverage ───────────────────────────────────
  # Read-only verbs on the Rollout CRD. Discovery is fail-open at the
  # operator side: if the CRD is not installed the watcher is never
  # registered, but the rule is harmless — RBAC permissions on a non-
  # existent resource are inert. Only `rollouts` is granted in this issue;
  # AnalysisRun / AnalysisTemplate / Experiment are NOT pre-granted (they
  # land with their own controllers in follow-up issues so RBAC always
  # mirrors the watcher set exactly).
  - apiGroups: ["argoproj.io"]
    resources: ["rollouts"]
    verbs: ["get", "list", "watch"]
  # ── end #161 ──────────────────────────────────────────────────────────
  # ── #190 DRA resource handles (discovery-skip if absent) ──────────────
  # Dynamic Resource Allocation went GA in Kubernetes 1.31. Watchers are
  # registered only when the resource.k8s.io/v1beta1 group is served (see
  # dra_setup.go::IsDRAAPIInstalled). RBAC is granted unconditionally —
  # rules on non-existent resources are inert. ResourceClaim is namespaced;
  # ResourceClaimTemplate is namespaced; ResourceSlice is cluster-scoped;
  # DeviceClass is cluster-scoped. Verbs are read-only.
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaims", "resourceclaimtemplates", "resourceslices", "deviceclasses"]
    verbs: ["get", "list", "watch"]
  # ── end #190 ──────────────────────────────────────────────────────────
  # Leader election lease — namespaced; gated to the operator's own namespace
  # below.
  {{- if .Values.leaderElection.enabled }}
  # (see RoleBinding below for the namespaced lease permission)
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "omniscience-operator.fullname" . }}
  labels:
    {{- include "omniscience-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "omniscience-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "omniscience-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.leaderElection.enabled }}
---
# Lease object lives in the operator's own namespace; this is the only
# write capability the operator has, and it is namespaced rather than cluster-wide.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "omniscience-operator.fullname" . }}-leader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "omniscience-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "omniscience-operator.fullname" . }}-leader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "omniscience-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "omniscience-operator.fullname" . }}-leader
subjects:
  - kind: ServiceAccount
    name: {{ include "omniscience-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
