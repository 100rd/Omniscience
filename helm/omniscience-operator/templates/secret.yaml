{{- /*
Workspace + NATS credentials Secret.

The workspace_id is the tenant boundary stamped on every event (ADR-0007 §ACL).
We deliberately reject install-time misconfiguration: workspaceId must be set,
and clusterName must be set, and nats.url must be set. A misconfigured operator
must NOT come up.
*/ -}}
{{- if not .Values.workspaceId -}}
{{- fail "workspaceId is required (UUID; see ADR-0007 §ACL)" -}}
{{- end -}}
{{- if not .Values.clusterName -}}
{{- fail "clusterName is required" -}}
{{- end -}}
{{- if not .Values.nats.url -}}
{{- fail "nats.url is required" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "omniscience-operator.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "omniscience-operator.labels" . | nindent 4 }}
type: Opaque
stringData:
  OMNISCIENCE_WORKSPACE_ID: {{ .Values.workspaceId | quote }}
  OMNISCIENCE_CLUSTER_NAME: {{ .Values.clusterName | quote }}
  OMNISCIENCE_NATS_URL: {{ .Values.nats.url | quote }}
  OMNISCIENCE_NATS_SUBJECT: {{ .Values.nats.subjectPrefix | quote }}
  # ── #163 reconciliation read-API client ───────────────────────────────────
  # Both fields are intentionally optional at chart-install time — empty
  # baseUrl disables the reconciliation worker (the watch path continues
  # to work), and the operator fails closed if baseUrl is set but
  # bearerToken is empty (config.Load() returns an error). The bearer
  # token MUST come from this Secret per ADR-0007 §ACL.
  OMNISCIENCE_API_BASE_URL: {{ .Values.api.baseUrl | quote }}
  OMNISCIENCE_API_BEARER_TOKEN: {{ .Values.api.bearerToken | quote }}
{{- if .Values.nats.credentials }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "omniscience-operator.fullname" . }}-nats-creds
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "omniscience-operator.labels" . | nindent 4 }}
type: Opaque
stringData:
  nats.creds: {{ .Values.nats.credentials | quote }}
{{- end }}
