apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "omniscience-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "omniscience-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "omniscience-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "omniscience-operator.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "omniscience-operator.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: manager
          image: {{ include "omniscience-operator.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # PSA-restricted compliant (#166). Defaults in values.yaml encode
          # the restricted floor; this template merges the user-provided
          # `securityContext` over a non-negotiable baseline so the floor
          # cannot be relaxed via values overrides.
          securityContext:
            {{- $floor := dict
                "allowPrivilegeEscalation" false
                "readOnlyRootFilesystem"   true
                "runAsNonRoot"             true
                "runAsUser"                65532
                "runAsGroup"               65532
                "capabilities"             (dict "drop" (list "ALL"))
                "seccompProfile"           (dict "type" "RuntimeDefault") }}
            {{- $merged := mergeOverwrite (deepCopy $floor) (.Values.securityContext | default dict) }}
            {{- /* re-stamp the load-bearing fields AFTER merge so user values cannot relax them */ -}}
            {{- $_ := set $merged "allowPrivilegeEscalation" false }}
            {{- $_ := set $merged "readOnlyRootFilesystem"   true }}
            {{- $_ := set $merged "runAsNonRoot"             true }}
            {{- $_ := set $merged "capabilities"             (dict "drop" (list "ALL")) }}
            {{- $_ := set $merged "seccompProfile"           (dict "type" "RuntimeDefault") }}
            {{- toYaml $merged | nindent 12 }}
          env:
            - name: OMNISCIENCE_RESYNC_PERIOD_SECONDS
              value: {{ .Values.resyncPeriodSeconds | quote }}
            - name: OMNISCIENCE_LEADER_ELECT
              value: {{ .Values.leaderElection.enabled | quote }}
            - name: OMNISCIENCE_METRICS_ADDR
              value: ":{{ .Values.service.metricsPort }}"
            - name: OMNISCIENCE_PROBE_ADDR
              value: ":{{ .Values.probes.livenessPort }}"
            {{- if .Values.nats.credentials }}
            - name: OMNISCIENCE_NATS_CREDS_FILE
              value: /etc/nats/creds/nats.creds
            {{- end }}
            # ── #163 reconciliation worker ────────────────────────────────
            - name: OMNISCIENCE_RECONCILE_INTERVAL
              value: {{ .Values.reconciler.interval | quote }}
            - name: OMNISCIENCE_RECONCILE_DRY_RUN
              value: {{ .Values.reconciler.dryRun | quote }}
          envFrom:
            - secretRef:
                name: {{ include "omniscience-operator.fullname" . }}-config
          {{- if .Values.nats.credentials }}
          volumeMounts:
            - name: nats-creds
              mountPath: /etc/nats/creds
              readOnly: true
          {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
              protocol: TCP
            - name: probes
              containerPort: {{ .Values.probes.livenessPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.livenessPath }}
              port: probes
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readinessPath }}
              port: probes
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.nats.credentials }}
      volumes:
        - name: nats-creds
          secret:
            secretName: {{ include "omniscience-operator.fullname" . }}-nats-creds
            defaultMode: 0400
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and (gt (int .Values.replicaCount) 1) .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range .Values.topologySpreadConstraints }}
        - maxSkew: {{ .maxSkew | default 1 }}
          topologyKey: {{ .topologyKey | default "topology.kubernetes.io/zone" }}
          whenUnsatisfiable: {{ .whenUnsatisfiable | default "ScheduleAnyway" }}
          labelSelector:
            matchLabels:
              {{- include "omniscience-operator.selectorLabels" $ | nindent 14 }}
        {{- end }}
      {{- end }}
