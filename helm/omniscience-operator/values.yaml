# Default values for omniscience-operator.
#
# Required values that have NO default and MUST be set:
#   - workspaceId
#   - clusterName
#   - nats.url
#
# Override per environment:
#   helm install omniscience-operator ./helm/omniscience-operator \
#     --set workspaceId=<UUID> \
#     --set clusterName=<name> \
#     --set nats.url=nats://omniscience-nats:4222

# ── Tenant identity (REQUIRED) ────────────────────────────────────────────────
# UUID stamped on every emitted event. Read from this value into a Secret
# mounted into the pod. NEVER derived from cluster-side resource state — see
# ADR-0007 §ACL.
workspaceId: ""

# Human-readable cluster identifier — appears in entity metadata. Not
# security-bearing.
clusterName: ""

# ── Image ─────────────────────────────────────────────────────────────────────
image:
  repository: ghcr.io/100rd/omniscience-operator
  pullPolicy: IfNotPresent
  # Overridden by CI: --set image.tag=$GIT_SHA
  tag: "0.2.0"
  # Production-recommended (#166): pin by digest for reproducibility and
  # cosign-verified provenance. When set (sha256:...), the manifest renders
  # `repository@digest` and the `tag` value is ignored at runtime. Empty by
  # default; CI emits a digest-pinned values overlay alongside the tag-pinned
  # default for customers who want immutable references.
  digest: ""

imagePullSecrets: []

# ── Replicas ──────────────────────────────────────────────────────────────────
# v0.2 ships single-replica. Multi-replica requires leaderElection.enabled=true.
replicaCount: 1

# ── NATS endpoint ─────────────────────────────────────────────────────────────
nats:
  # NATS JetStream URL (required). Example: nats://omniscience-nats:4222
  url: ""
  # Subject prefix; the workspace_id is appended at publish time.
  subjectPrefix: "ingest.changes.k8s"
  # User-credentials file content. When set, a Secret is created and mounted
  # at /etc/nats/creds/nats.creds. Required in non-dev environments.
  credentials: ""

# ── Resync ────────────────────────────────────────────────────────────────────
# Informer resync window in seconds. 600 (10 min) balances drift recovery
# against reconcile cost on large clusters.
resyncPeriodSeconds: 600

# ── Leader election ───────────────────────────────────────────────────────────
leaderElection:
  enabled: false

# ── Resources ─────────────────────────────────────────────────────────────────
# Empirical envelope from #157-#162: single-digit MB idle, ~100 MiB peak under
# heavy churn at ~10k watched objects. The defaults here match issue #166 and
# leave headroom; tune for your cluster size.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# ── ServiceAccount ────────────────────────────────────────────────────────────
serviceAccount:
  create: true
  name: ""
  annotations: {}

# ── RBAC ──────────────────────────────────────────────────────────────────────
# v0.2 needs cluster-scoped read on Pods. The ClusterRole is intentionally
# narrow — adding kinds is a follow-up issue per epic #98.
rbac:
  create: true

# ── Probes ────────────────────────────────────────────────────────────────────
probes:
  livenessPath: /healthz
  livenessPort: 8081
  readinessPath: /readyz
  readinessPort: 8081

# ── Pod security ──────────────────────────────────────────────────────────────
# Defaults follow the "restricted" Pod Security Standard.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# ── Service (for metrics scraping) ────────────────────────────────────────────
service:
  enabled: true
  type: ClusterIP
  metricsPort: 8080

# ── Pod placement ─────────────────────────────────────────────────────────────
nodeSelector: {}
tolerations: []
affinity: {}

# Topology-spread for HA (#166). Effective only when replicaCount >= 2 AND
# leaderElection.enabled=true. Default constraint distributes replicas across
# zones (`topology.kubernetes.io/zone`), `ScheduleAnyway` so single-zone
# clusters still schedule. Customers running on a hostname-only spread (e.g.
# bare-metal) override `topologyKey: kubernetes.io/hostname`.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels: {}  # rendered to selectorLabels by the deployment template

# ── Reconciliation worker (#163) ──────────────────────────────────────────────
# Drift detector that periodically compares cluster state against the
# Omniscience graph slice for (workspaceId, clusterId) and emits corrective
# events. See operator/internal/reconciler for the implementation.
reconciler:
  # Period between reconcile cycles. 15 minutes is the issue #163 default —
  # balances drift recovery latency against read-API + cluster-list cost.
  # Format is any time.ParseDuration value (e.g. "15m", "30m", "1h").
  interval: 15m
  # Dry-run mode: log diff and increment metrics, emit ZERO events. Used
  # for first-time-on-customer-cluster validation before flipping to live.
  dryRun: false

# Omniscience server read API. The reconciler queries this surface to learn
# which entities the graph believes exist for (workspaceId, clusterId).
api:
  # Absolute base URL of the Omniscience server. Empty disables the
  # reconciler entirely; the rest of the operator continues to start.
  baseUrl: ""
  # Bearer token authenticating the operator to the read API. MUST come
  # from a Secret-mounted file. The server gates the workspaceId query
  # parameter against the token's workspace and 403s on mismatch — this
  # is the load-bearing ACL gate (ADR-0007 §ACL, issue #163).
  bearerToken: ""

# ── Omniscience server URL for NetworkPolicy egress allow-list (#166) ────────
# Distinct from `api.baseUrl` only because the NetworkPolicy template needs
# host:port at render time even when the reconciler is running in dry-run or
# disabled mode (some customers want the policy in place ahead of the worker
# being enabled). When `omniscience.serverUrl` is empty AND `api.baseUrl` is
# set, the chart falls back to `api.baseUrl` for the egress rule.
#
# Format: `https://api.omniscience.example.com:443` or `http://omniscience-server:8000`
# The chart parses host + port at template time and emits an explicit egress rule.
omniscience:
  serverUrl: ""

# ── Annotations / labels ──────────────────────────────────────────────────────
podAnnotations: {}
podLabels: {}

# ── Observability (#165) ──────────────────────────────────────────────────────
# Default Prometheus / Grafana wiring. Every section is opt-in (default false)
# because not every cluster runs Prometheus Operator. The metrics themselves
# are always exposed on :8080 by the controller-runtime metrics endpoint;
# this section only controls discovery objects (ServiceMonitor, PrometheusRule,
# Grafana sidecar ConfigMap).
#
# ACL invariant: the operator's metrics endpoint MUST NOT carry workspace_id
# in any label (ADR-0007 §ACL, issue #165). The chart MUST NOT add labels
# that synthesise tenancy back in via relabel rules.
serviceMonitor:
  # When true, render a Prometheus Operator ServiceMonitor scraping the
  # operator's metrics Service. Requires monitoring.coreos.com/v1 CRDs;
  # the template is gated by .Capabilities.APIVersions.Has so installing
  # against a cluster without Prometheus Operator is a no-op rather than
  # a chart failure.
  enabled: false
  # Scrape interval. 30s matches Prometheus defaults; reduce to 15s on
  # latency-sensitive deployments at the cost of TSDB write amplification.
  interval: 30s
  scrapeTimeout: 10s
  # Extra labels merged onto the ServiceMonitor metadata. Use to attach the
  # cluster's monitoring "team" label so Prometheus's serviceMonitorSelector
  # picks it up.
  labels: {}
  # Relabel rules applied at scrape time. The default is empty — operators
  # MUST NOT add a workspace_id relabel here per ADR-0007 §ACL.
  relabelings: []
  metricRelabelings: []

prometheusRule:
  # When true, render a PrometheusRule containing the default operator
  # alerts. Same CRD-presence guard as ServiceMonitor.
  enabled: false
  # Extra labels attached to every alert (e.g. "team: platform").
  labels: {}
  # `for:` durations per rule. Cold-start safety: the publishStalled rule
  # ALSO requires last_publish_unix_seconds > 0 (encoded in the rule
  # expression itself, not configurable here).
  defaults:
    publishStalledFor: 5m
    publishErrorBurstFor: 10m
    emitLagHighFor: 15m
    reconcileFailingWindow: 1h
    reconcileDriftWindow: 1h
  # Each rule can be individually disabled when a customer's platform team
  # owns the same alert in their own stack.
  rules:
    publishStalled:
      enabled: true
      severity: warning
    publishErrorBurst:
      enabled: true
      severity: warning
    reconcileFailing:
      enabled: true
      severity: info
    emitLagHigh:
      enabled: true
      severity: info
    reconcileDriftHigh:
      enabled: true
      severity: info
  # runbookBaseUrl is prepended to each rule's runbook anchor. Override per
  # deployment so the link points at the customer's own runbook clone.
  runbookBaseUrl: "https://github.com/100rd/Omniscience/blob/main/docs/runbooks/operator-alerts.md"

dashboards:
  # When true, render a ConfigMap containing the default Grafana dashboards
  # and label them so the Grafana sidecar (kiwigrid/k8s-sidecar) auto-imports
  # them. Customers not using the sidecar can disable this and import the
  # JSON manually from helm/omniscience-operator/dashboards/.
  enabled: false
  # Label the sidecar watches for. The default matches kube-prometheus-stack.
  labelKey: grafana_dashboard
  labelValue: "1"
  # Annotations passed through to the ConfigMap. Useful for sidecar folder
  # routing, e.g. {grafana_folder: Omniscience}.
  annotations: {}

# ── Pod Security Admission (#166) ─────────────────────────────────────────────
# Apply Pod Security Standards `restricted` labels to the operator's namespace.
# This is the chart's per-namespace enforcement; cluster-wide PSA rollout is
# the customer's platform-team responsibility.
#
# When enabled (default), the chart renders a Namespace manifest that adds:
#   pod-security.kubernetes.io/enforce: restricted
#   pod-security.kubernetes.io/audit:   restricted
#   pod-security.kubernetes.io/warn:    restricted
#
# IMPORTANT: rendering a Namespace manifest implies the chart "owns" the
# namespace. If the customer pre-creates the namespace (the typical
# enterprise workflow), set `podSecurity.manageNamespace: false` and
# label the namespace out-of-band. The pod spec is `restricted`-compliant
# regardless of this toggle.
podSecurity:
  enforce: true
  manageNamespace: false   # set true if you want Helm to render the Namespace
  level: restricted
  version: latest

# ── NetworkPolicy (#166) ──────────────────────────────────────────────────────
# Default-deny ingress + egress with a documented allow-list. The fourth layer
# of operator defence-in-depth (ADR-0007 §ACL) — bounds the operator's blast
# radius even if the binary is compromised.
#
# CNI assumptions: standard NetworkPolicy v1 semantics (Calico, Cilium,
# kube-router, AWS VPC CNI w/ policy enforcement). Network plugins that do
# NOT honour egress rules (older Flannel, Weave-Net without npc) reduce this
# to ingress-only enforcement; the chart cannot detect this — document the
# CNI requirement at install time.
networkPolicy:
  enabled: true

  # Namespace selector for Prometheus scraping the metrics endpoint.
  # Defaults to a label customers commonly attach to their monitoring
  # namespace. Override to match your kube-prometheus-stack install.
  metricsAllowedNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: monitoring

  # Probe-port (8081) ingress allow-list. Kubelet sources from node IPs
  # which do not carry namespace labels, so the policy needs an empty
  # `from:` (allows from anywhere on that port). Enterprise deployments
  # may pin to the cluster CIDR; we expose `probePortAllowedFrom` for
  # that override.
  probePortAllowedFrom: []  # empty = allow from anywhere (kubelet-friendly)

  # DNS allow-list — the kube-system namespace by default. Customers running
  # CoreDNS in another namespace override this.
  dnsNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: kube-system

  # API-server allow-list. The Kubernetes API server is reached via the
  # well-known `kubernetes.default.svc` ClusterIP. The standard idiom is
  # to allow egress to TCP/443 on a label selector that matches kube-apiserver
  # endpoints, OR — when CNI supports CIDR rules and the API is exposed on a
  # stable VIP — pin by CIDR. We default to a port-only egress rule (no peer
  # selector); this is the broadest practical match short of CNI-specific
  # FQDN policies.
  apiServerPort: 443
  # When set, restrict apiserver egress to a specific CIDR (typical for
  # managed clusters where the apiserver lives outside the pod network).
  # Empty = no CIDR restriction (port-only).
  apiServerCIDR: ""
