repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.7
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        additional_dependencies: [pydantic>=2.7.0, pydantic-settings>=2.3.0]
        args: [--strict]

  - repo: local
    hooks:
      - id: stale-architecture-comments
        name: Prevent stale architecture comments (#105 cutover, removed pgvector)
        entry: "(?i)(unwired after #105|pgvector.*removed|sql-side graph storage.*deprecated|legacy_retrieval_service_unwired)"
        language: pygrep
        types: [python]
        exclude: "^(scripts/migrate_to_hybrid\\.py|packages/core/alembic/versions/.*|scripts/lint_stale_architecture\\.py)$"
