[project]
name = "omniscience"
version = "0.2.0"
description = "Self-hosted knowledge retrieval service with MCP-first API"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "omniscience-server",
    "omniscience-cli",
]

[tool.uv.workspace]
exclude = ["apps/admin"]
members = [
    "apps/*",
    "packages/*",
    "examples/*",
]

[tool.uv.sources]
omniscience-core                 = { workspace = true }
omniscience-connectors           = { workspace = true }
omniscience-embeddings           = { workspace = true }
omniscience-index                = { workspace = true }
omniscience-retrieval            = { workspace = true }
omniscience-server               = { workspace = true }
omniscience-cli                  = { workspace = true }
omniscience-parsers              = { workspace = true }
omniscience-plugin-example       = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.4.7",
    "mypy>=1.10.0",
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "pre-commit>=3.7.1",
    "omniscience-core[all]",
    "omniscience-connectors",
    "omniscience-server",
    "omniscience-embeddings",
    "omniscience-index",
    "tenacity>=9.1.4",
    "respx>=0.23.1",
    "omniscience-parsers",
    "omniscience-retrieval",
    "omniscience-cli",
    "omniscience-plugin-example",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "moto>=5.1.22",
    "boto3-stubs[s3]>=1.42.91",
    "types-PyYAML>=6.0.0",  # mypy stubs for bench/runner.py (issue #241 scaffolding)
    "testcontainers[neo4j,qdrant]>=4.8.0",
    "hypothesis>=6.108.0",
]

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "S", "T20", "SIM", "TCH", "RUF"]
ignore = [
    "TC001", # Application imports in TYPE_CHECKING blocks — causes issues with pydantic models
    "TC002", # Third-party imports in TYPE_CHECKING blocks — causes runtime issues with starlette
    "TC003", # Stdlib imports in TYPE_CHECKING blocks — we use from __future__ import annotations
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",  # assert is the standard pytest assertion mechanism
    "S306",  # Insecure mktemp — test-only, we unlink immediately
    "S603",  # subprocess call — test helpers run git in controlled fixtures
    "S607",  # Partial executable path — controlled test environment
]
# Placeholder credentials in test fixtures: S105 (hardcoded string assignments /
# comparisons), S106 (call keyword arguments), S107 (function defaults). Scoped to
# the individual files that use them instead of blanket-disabling the checks for
# the whole test tree. S108/B017 are handled with per-line noqa at the few sites
# that need them.
"tests/connectors/contract_tests.py" = ["S106"]
"tests/conformance/test_ap1_per_entity_cas.py" = ["S106"]
"tests/integration/test_neo4j_bootstrap_schema.py" = ["S105"]
"tests/integration/test_neo4j_writer_metadata.py" = ["S105"]
"tests/integration/test_replay.py" = ["S105"]
"tests/test_alerts_webhook.py" = ["S106", "S107"]
"tests/test_auth.py" = ["S105"]
"tests/test_build_aws_docs.py" = ["S106"]
"tests/test_cli.py" = ["S105", "S106"]
"tests/test_connector_sdk.py" = ["S105", "S106"]
"tests/test_connectors_v2.py" = ["S105"]
"tests/test_db_schema.py" = ["S105", "S106"]
"tests/test_federation.py" = ["S105", "S106", "S107"]
"tests/test_git_connector.py" = ["S105"]
"tests/test_github_pr_connector.py" = ["S105"]
"tests/test_github_pr_webhook.py" = ["S105"]
"tests/test_ingestion_e2e.py" = ["S106"]
"tests/test_init_cli.py" = ["S106", "S107"]
"tests/test_mcp_incident_timeline_coverage.py" = ["S105"]
"tests/test_mcp_list_entities.py" = ["S105"]
"tests/test_mcp_server_coverage.py" = ["S105"]
"tests/test_merge_unmerge_store.py" = ["S106"]
"tests/test_multi_tenant.py" = ["S105", "S106"]
"tests/test_neo4j_store.py" = ["S106"]
"tests/test_neo4j_store_as_of.py" = ["S106"]
"tests/test_neo4j_store_bitemporal_backfill.py" = ["S106"]
"tests/test_neo4j_store_bitemporal_schema.py" = ["S106"]
"tests/test_neo4j_store_bitemporal_writer.py" = ["S106"]
"tests/test_neo4j_store_list_entities.py" = ["S106"]
"tests/test_pagerduty_connector.py" = ["S105"]
"tests/test_rest_api.py" = ["S105"]
"tests/test_s3_connector.py" = ["S105", "S106"]
"tests/test_slack_connector_entities.py" = ["S105"]
"tests/test_store_contract.py" = ["S106"]
"tests/test_tombstone_end_dating.py" = ["S106"]
"tests/test_webhooks.py" = ["S105", "S106"]
"benchmarks/*" = [
    "S101",  # assert is the standard pytest assertion mechanism
]
"scripts/*" = [
    "T201",    # print is the standard CLI output mechanism for one-shot scripts
    "S108",    # /tmp paths are intentional for one-shot operational glue scripts
    "S310",    # urlopen targets the trusted cluster API URL in fetch scripts
    "SIM115",  # json.load(open(...)) is acceptable for short-lived one-shot scripts
]
"bench/runner.py" = [
    "T201",  # print is the standard CLI output mechanism for the bench runner
]
"bench/runner_matrix.py" = [
    "T201",  # print is the standard CLI output mechanism for the matrix runner
]
"helm/**/tests/**" = [
    "S101",  # assert is the standard pytest assertion mechanism
    "S603",  # subprocess call — helm template invocations in controlled CI
    "S607",  # Partial executable path — controlled CI environment
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing --cov-fail-under=80"
