[project]
name = "omniscience"
version = "0.2.0"
description = "Self-hosted knowledge retrieval service with MCP-first API"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "omniscience-server",
    "omniscience-cli",
]

[tool.uv.workspace]
exclude = ["apps/admin"]
members = [
    "apps/*",
    "packages/*",
    "examples/*",
]

[tool.uv.sources]
omniscience-core                 = { workspace = true }
omniscience-connectors           = { workspace = true }
omniscience-embeddings           = { workspace = true }
omniscience-index                = { workspace = true }
omniscience-retrieval            = { workspace = true }
omniscience-server               = { workspace = true }
omniscience-cli                  = { workspace = true }
omniscience-parsers              = { workspace = true }
omniscience-plugin-example       = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.4.7",
    "mypy>=1.10.0",
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "pre-commit>=3.7.1",
    "omniscience-core",
    "omniscience-connectors",
    "omniscience-server",
    "omniscience-embeddings",
    "omniscience-index",
    "tenacity>=9.1.4",
    "respx>=0.23.1",
    "omniscience-parsers",
    "omniscience-retrieval",
    "omniscience-cli",
    "omniscience-plugin-example",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "moto>=5.1.22",
    "boto3-stubs[s3]>=1.42.91",
    "types-PyYAML>=6.0.0",  # mypy stubs for bench/runner.py (issue #241 scaffolding)
    "testcontainers[neo4j,qdrant]>=4.8.0",
    "hypothesis>=6.108.0",
]

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "S", "T20", "SIM", "TCH", "RUF"]
ignore = [
    "S104",  # Binding to all interfaces — required for containerised services
    "TC001", # Application imports in TYPE_CHECKING blocks — causes issues with pydantic models
    "TC002", # Third-party imports in TYPE_CHECKING blocks — causes runtime issues with starlette
    "TC003", # Stdlib imports in TYPE_CHECKING blocks — we use from __future__ import annotations
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",  # assert is the standard pytest assertion mechanism
    "S105",  # Hardcoded password string — test fixtures use placeholder values
    "S106",  # Hardcoded password in function argument — test fixtures only
    "S107",  # Hardcoded password in function default — test fixtures only
    "S108",  # Probable insecure usage of temp file — test-only temp paths
    "S306",  # Insecure mktemp — test-only, we unlink immediately
    "S603",  # subprocess call — test helpers run git in controlled fixtures
    "S607",  # Partial executable path — controlled test environment
    "B017",  # Do not assert blind exception — inherited from contract tests
]
"benchmarks/*" = [
    "S101",  # assert is the standard pytest assertion mechanism
]
"scripts/*" = [
    "T201",    # print is the standard CLI output mechanism for one-shot scripts
    "S108",    # /tmp paths are intentional for one-shot operational glue scripts
    "S310",    # urlopen targets the trusted cluster API URL in fetch scripts
    "SIM115",  # json.load(open(...)) is acceptable for short-lived one-shot scripts
]
"bench/runner.py" = [
    "T201",  # print is the standard CLI output mechanism for the bench runner
]
"bench/runner_matrix.py" = [
    "T201",  # print is the standard CLI output mechanism for the matrix runner
]
"helm/**/tests/**" = [
    "S101",  # assert is the standard pytest assertion mechanism
    "S603",  # subprocess call — helm template invocations in controlled CI
    "S607",  # Partial executable path — controlled CI environment
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing --cov-fail-under=80"
