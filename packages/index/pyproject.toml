[project]
name = "omniscience-index"
version = "0.2.0"
description = "PostgreSQL + Qdrant index layer for Omniscience"
requires-python = ">=3.12"
dependencies = [
    # queue: index imports omniscience_core.queue.messages (event schemas),
    # whose package __init__ needs nats-py.  telemetry: importing
    # omniscience_core.telemetry.metrics executes the sub-package __init__,
    # which wires the OTel SDK.
    "omniscience-core[queue,telemetry]",
    "omniscience-embeddings",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "neo4j>=5.19.0",
    "qdrant-client>=1.17,<1.18",
    "structlog>=24.1.0",
]

[tool.uv.sources]
omniscience-core = { workspace = true }
omniscience-embeddings = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omniscience_index"]
