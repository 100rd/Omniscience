[project]
name = "omniscience-embeddings"
version = "0.2.0"
description = "Pluggable embedding providers for Omniscience (Ollama, OpenAI, Voyage, Cohere)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "tenacity>=8.3.0",
    "omniscience-core",
]

[project.optional-dependencies]
local = [
    "sentence-transformers>=3.0,<6",
]

[tool.uv.sources]
omniscience-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omniscience_embeddings"]
