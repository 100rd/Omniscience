id: bench-0028
category: deploy-rollback
description: >
  Rollback to previous deployment failed because the secret it referenced
  had been rotated and the old secret version was garbage-collected by
  External Secrets Operator.

alert_payload:
  provider: argocd
  alert_id: argocd-sync-failed-payments-2026-04-28
  workspace_id: aaaaaaaa-1111-2222-3333-4444aa000241
  fired_at: "2026-04-28T11:11:00+00:00"
  summary: "payments deploy stuck — pods CrashLoopBackOff after rollback, missing secret"
  target_entity: "deployment/payments"

expected_root_cause:
  summary: >
    PR #4502 rotated payments-stripe-secret to version v7; ESO purged v6.
    Rollback target manifest still references secret version v6.
  canonical_entities:
    - "https://github.com/acme/secrets/pull/4502"
    - "secret/payments-stripe-secret"
    - "deployment/payments"

expected_runbook_step: >
  Update rollback manifest to reference current secret version v7; re-sync ArgoCD app.

expected_blast_radius:
  - "service/payments"
  - "service/checkout"
