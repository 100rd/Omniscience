apiVersion: v2
name: omniscience
description: Omniscience Owner Helm Chart (management-local-observe-v1)
type: application
version: 0.2.0
appVersion: "639c52dac220b461d286b86a6fdeb36cf89300a4"
dependencies:
  - name: postgresql
    version: "18.12.18"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: nats
    version: "2.15.2"
    repository: "https://nats-io.github.io/k8s/helm/charts/"
    condition: nats.enabled
  - name: neo4j
    version: "2026.10.1"
    repository: "https://helm.neo4j.com/neo4j"
    condition: neo4j.enabled
  - name: qdrant
    version: "1.20.0"
    repository: "https://qdrant.github.io/qdrant-helm"
    condition: qdrant.enabled
