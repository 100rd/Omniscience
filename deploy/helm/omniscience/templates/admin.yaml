{{- if .Values.admin.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omniscience-admin
  labels:
    {{- include "omniscience.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin
spec:
  replicas: {{ int .Values.admin.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: omniscience
      app.kubernetes.io/component: admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: omniscience
        app.kubernetes.io/component: admin
    spec:
      containers:
        - name: admin
          image: "{{ .Values.admin.image.repository }}:{{ .Values.admin.image.tag }}"
          imagePullPolicy: {{ .Values.admin.image.pullPolicy }}
          ports:
            - { name: http, containerPort: {{ int .Values.admin.port }} }
          readinessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata:
  name: omniscience-admin
  labels:
    {{- include "omniscience.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin
spec:
  selector:
    app.kubernetes.io/name: omniscience
    app.kubernetes.io/component: admin
  ports:
    - { name: http, port: {{ int .Values.admin.port }}, targetPort: http }
---
apiVersion: v1
kind: Service
metadata:
  name: app
spec:
  selector:
    app.kubernetes.io/name: omniscience
    app.kubernetes.io/component: api
  ports:
    - { name: http, port: {{ int .Values.service.port }}, targetPort: http }
{{- if .Values.admin.httpRoute.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: omniscience-admin
  labels:
    {{- include "omniscience.labels" . | nindent 4 }}
spec:
  hostnames:
    - {{ .Values.admin.httpRoute.hostname | quote }}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.admin.httpRoute.gatewayName | quote }}
      namespace: {{ .Values.admin.httpRoute.gatewayNamespace | quote }}
      sectionName: {{ .Values.admin.httpRoute.sectionName | quote }}
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: omniscience-admin
          port: {{ int .Values.admin.port }}
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
{{- end }}
{{- end }}
