apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "omniscience.fullname" . }}
  labels:
    {{- include "omniscience.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ int .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: omniscience
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: omniscience
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: omniscience-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: {{ int .Values.service.port }} }
          envFrom:
            - configMapRef: { name: {{ include "omniscience.fullname" . }} }
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "omniscience.secretName" . }}
                  key: DATABASE_URL
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "omniscience.secretName" . }}
                  key: NEO4J_PASSWORD
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "omniscience.secretName" . }}
                  key: QDRANT_API_KEY
            - name: OMNISCIENCE_LOCAL_OBSERVE_BROKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "omniscience.secretName" . }}
                  key: OMNISCIENCE_LOCAL_OBSERVE_BROKER_TOKEN
          readinessProbe: { httpGet: { path: /ready, port: http }, initialDelaySeconds: 10, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 45, periodSeconds: 15 }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "omniscience.fullname" . }}
  labels:
    {{- include "omniscience.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: omniscience
    app.kubernetes.io/component: api
  ports:
    - { name: http, port: {{ int .Values.service.port }}, targetPort: http }
