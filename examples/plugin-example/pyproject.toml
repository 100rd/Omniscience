[project]
name = "omniscience-plugin-example"
version = "0.1.0"
description = "Example third-party connector plugin for Omniscience"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Example Author", email = "author@example.com" }]
dependencies = [
    "omniscience-connectors>=0.1.0",
    "pydantic>=2.7.0",
]

# Register the connector with Omniscience's plugin discovery mechanism.
# The key is the logical plugin name; the value is "module.path:ClassName".
[project.entry-points."omniscience.connectors"]
example = "omniscience_plugin_example.connector:ExampleConnector"

[tool.uv.sources]
omniscience-connectors = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omniscience_plugin_example"]
